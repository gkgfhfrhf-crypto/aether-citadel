
name: Deploy Aether Citadel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract and build project
        run: |
          mkdir -p extracted site
          unzip -q AETHER_CITADEL_PAGES_READY_FIXED.zip -d extracted

          PACKAGE_FILE="$(find extracted -name package.json -not -path '*/node_modules/*' -print -quit)"

          if [ -n "$PACKAGE_FILE" ]; then
            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
            cd "$PROJECT_DIR"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            INDEX_FILE="$(find extracted -name index.html -print -quit)"
            test -n "$INDEX_FILE"
            PROJECT_DIR="$(dirname "$INDEX_FILE")"
            cd "$PROJECT_DIR"
            npm init -y
            npm install --no-audit --no-fund vite@6 three@0.170.0
          fi

          npx vite build --base=/aether-citadel/
          test -d dist
          cp -a dist/. "$GITHUB_WORKSPACE/site/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
