<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b16"><meta name="description" content="AETHER CITADEL — cinematic orbital station simulation">
<title>AETHER CITADEL · 苍穹堡垒</title>
<style>
:root{--cyan:#74d9ff;--line:#4cbce8;--panel:rgba(4,15,30,.72);--muted:#9ab8cb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#e8f7ff;font-family:Inter,"Microsoft YaHei",sans-serif;touch-action:none}
#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 8px #00111d}
.brand{position:absolute;left:22px;top:18px;font-size:clamp(16px,2vw,26px);letter-spacing:.18em;color:#bdeaff;font-weight:300}
.brand small{display:block;font-size:10px;letter-spacing:.34em;color:#78b6d3;margin-top:5px}
.panel{background:linear-gradient(135deg,rgba(4,20,38,.84),rgba(4,12,26,.54));border:1px solid rgba(105,205,255,.5);box-shadow:0 0 22px rgba(31,157,222,.12),inset 0 0 22px rgba(39,154,210,.07);backdrop-filter:blur(10px);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.nav{position:absolute;left:20px;top:112px;width:190px;padding:8px;pointer-events:auto}
button,select{font:inherit;color:#dff6ff;background:rgba(9,31,52,.74);border:1px solid rgba(106,202,244,.35);border-radius:2px}
.nav button{display:block;width:100%;text-align:left;padding:13px 12px;margin:4px 0;letter-spacing:.08em;font-size:14px}
button:active{background:rgba(35,117,159,.8)}button.active{border-color:#9be6ff;box-shadow:inset 0 0 18px #1c6384;color:#fff}
.status{position:absolute;right:20px;top:18px;width:225px;padding:14px 16px;font-size:12px;color:#c7e6f5}
.status b{color:#fff;font-weight:500}.bar{height:4px;background:#17364b;margin:6px 0 12px}.bar i{display:block;height:100%;width:96%;background:linear-gradient(90deg,#237aa7,#8ce7ff);box-shadow:0 0 8px #66d6ff}
.info{position:absolute;left:20px;bottom:20px;width:245px;padding:13px;font-size:12px;color:var(--muted)}
.info strong{display:block;color:#e5f8ff;font-size:15px;margin-bottom:6px}
.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;pointer-events:auto}
.controls button{min-width:66px;padding:10px 9px;font-size:12px}
.help{position:absolute;right:20px;bottom:22px;color:#91b9ce;font-size:11px;text-align:right}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:10px 18px;border:1px solid #65cfff;background:#06182bdc;color:#dff7ff;opacity:0;transition:opacity .25s}
@media(max-width:650px){.brand{left:12px;top:12px}.nav{left:10px;top:82px;width:142px}.nav button{font-size:11px;padding:10px 7px}.status{right:10px;top:10px;width:150px;font-size:10px;padding:9px}.info{left:10px;bottom:72px;width:175px;font-size:10px}.controls{bottom:10px;gap:3px;padding:5px}.controls button{min-width:48px;padding:9px 5px;font-size:10px}.help{display:none}}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud">
 <div class="brand">AETHER CITADEL <small>苍穹堡垒 · DEEP SPACE OPERATIONS</small></div>
 <div class="nav panel">
  <button class="active" data-mode="station">◈　进入空间站</button>
  <button data-mode="system">◎　太阳系探索</button>
  <button data-mode="ship">➤　飞船控制</button>
  <button id="disassemble">⌘　拆解模式</button>
  <button id="reset">↺　恢复结构</button>
 </div>
 <div class="status panel"><b>空间站状态</b><span style="float:right;color:#72f3b0">● 运行正常</span><hr style="border:0;border-top:1px solid #31536a;margin:10px 0">
  能量储备 <b style="float:right">96%</b><div class="bar"><i></i></div>
  结构完整度 <b style="float:right" id="integrity">100%</b><div class="bar"><i id="integritybar"></i></div>
  渲染质量 <select id="quality" style="float:right;font-size:11px"><option value="1">省电</option><option value="1.4" selected>平衡</option><option value="2">高画质</option></select>
 </div>
 <div class="info panel"><strong id="infoTitle">苍穹堡垒 · 核心站</strong><span id="infoText">人类深空轨道枢纽。拖动屏幕环视空间站，双指或滚轮缩放。</span></div>
 <div class="controls panel"><button id="pause">Ⅱ 暂停</button><button id="zoomIn">＋ 缩放</button><button id="zoomOut">－ 缩放</button><button id="home">⌖ 归位</button><button id="full">⛶ 全屏</button></div>
 <div class="help">DRAG TO ORBIT　·　PINCH TO ZOOM<br>触屏拖动旋转 · 双指缩放</div><div id="toast"></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const root=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);scene.fog=new THREE.FogExp2(0x020611,.0015);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,3000);let radius=175,theta=.25,phi=1.22,target=new THREE.Vector3(0,0,0);
function cameraUpdate(){camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}cameraUpdate();
scene.add(new THREE.AmbientLight(0x7897b5,.7));const sunLight=new THREE.DirectionalLight(0xffe1bd,3.2);sunLight.position.set(-180,110,120);scene.add(sunLight);
const starGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<6500;i++){let r=800*Math.random()+250,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);starPos.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb8dfff,size:1.1,sizeAttenuation:true})));
function mat(color,metal=0.75,rough=.38,emissive=0x000000){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough,emissive,emissiveIntensity:.4})}
const station=new THREE.Group();scene.add(station);
const titanium=mat(0x667887,.86,.31),dark=mat(0x182b3a,.8,.36),white=mat(0xaebdc5,.72,.28),glow=new THREE.MeshStandardMaterial({color:0x65dfff,emissive:0x168acb,emissiveIntensity:2,metalness:.4,roughness:.2});
function cyl(parent,r1,r2,len,material,pos,rot){let m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,48,1),material);m.position.set(...pos);if(rot)m.rotation.set(...rot);parent.add(m);return m}
function box(parent,geo,material,pos,rot){let m=new THREE.Mesh(geo,material);m.position.set(...pos);if(rot)m.rotation.set(...rot);parent.add(m);return m}
cyl(station,8,10,46,titanium,[0,0,0],[0,0,0]);
for(let y of [-20,-12,12,20]){cyl(station,11,11,2,white,[0,y,0]);}
for(let y of [-7,7]){let ring=new THREE.Mesh(new THREE.TorusGeometry(54,4.4,12,180),titanium);ring.rotation.x=Math.PI/2;ring.position.y=y;station.add(ring);
 let inner=new THREE.Mesh(new THREE.TorusGeometry(48.5,.8,8,180),glow);inner.rotation.x=Math.PI/2;inner.position.y=y;station.add(inner);
 for(let i=0;i<48;i++){let a=i/48*Math.PI*2;let pod=box(station,new THREE.BoxGeometry(8,5,13),i%3?dark:white,[Math.cos(a)*54,y,Math.sin(a)*54],[0,-a,0]);let win=box(station,new THREE.BoxGeometry(5,.25,1),glow,[Math.cos(a)*54,y+2.65,Math.sin(a)*54],[0,-a,0]);}
}
for(let i=0;i<12;i++){let a=i*Math.PI/6;let arm=box(station,new THREE.BoxGeometry(3,3,38),titanium,[Math.cos(a)*34,0,Math.sin(a)*34],[0,-a,0]);box(station,new THREE.BoxGeometry(1.1,1.1,34),glow,[Math.cos(a)*34,1.8,Math.sin(a)*34],[0,-a,0]);}
for(let i=0;i<8;i++){let a=i*Math.PI/4;let p=[Math.cos(a)*72,0,Math.sin(a)*72];box(station,new THREE.BoxGeometry(25,1,18),dark,p,[0,-a,0]);for(let j=0;j<4;j++)box(station,new THREE.BoxGeometry(5,.3,17),mat(0x31516a,.65,.3),[p[0]+Math.cos(a)*((j-1.5)*5),.8,p[2]+Math.sin(a)*((j-1.5)*5)],[0,-a,0]);}
const parts=[];station.traverse(o=>{if(o.isMesh)parts.push({o,p:o.position.clone()})});
const ship=new THREE.Group();scene.add(ship);const hull=box(ship,new THREE.ConeGeometry(5,23,8),white,[0,0,0],[Math.PI/2,0,0]);box(ship,new THREE.BoxGeometry(23,1,7),dark,[0,-2,2]);box(ship,new THREE.BoxGeometry(7,1,14),titanium,[0,-2,-3]);for(let x of [-3,3]){let engine=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.2,5,20),glow);engine.rotation.x=Math.PI/2;engine.position.set(x,0,12);ship.add(engine)}ship.position.set(-75,-22,70);
const earth=new THREE.Mesh(new THREE.SphereGeometry(92,64,48),new THREE.MeshStandardMaterial({color:0x28618e,roughness:.85,metalness:.05}));earth.position.set(0,-150,-30);scene.add(earth);
const cloud=new THREE.Mesh(new THREE.SphereGeometry(93,48,32),new THREE.MeshBasicMaterial({color:0x79cfff,transparent:true,opacity:.12,side:THREE.BackSide}));cloud.position.copy(earth.position);scene.add(cloud);
const sun=new THREE.Mesh(new THREE.SphereGeometry(22,32,32),new THREE.MeshBasicMaterial({color:0xffd49b}));sun.position.set(-260,130,-200);scene.add(sun);
const planets=new THREE.Group();scene.add(planets);for(let i=0;i<7;i++){let r=12+i*12;let p=new THREE.Mesh(new THREE.SphereGeometry(2.5+i*.45,24,16),new THREE.MeshStandardMaterial({color:[0xb7a08a,0x8b9eaa,0x5a8db4,0xc88d63,0xb6a57e,0x86a8b9,0x4c7194][i],roughness:.8}));p.position.set(Math.cos(i*.9)*r,25+Math.sin(i*.7)*12,-140-Math.sin(i*.9)*r);planets.add(p)}
let mode='station',paused=true,disassembled=false,shipT=0;
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1300)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;target.copy(mode==='system'?new THREE.Vector3(0,0,-100):new THREE.Vector3(0,0,0));radius=mode==='system'?260:175;cameraUpdate();document.querySelector('#infoTitle').textContent=mode==='system'?'太阳系观测模式':mode==='ship'?'飞船控制模式':'苍穹堡垒 · 核心站';document.querySelector('#infoText').textContent=mode==='system'?'切换至远景轨道，观察行星分布。':mode==='ship'?'观察巡航飞船及推进系统。':'拖动屏幕环视空间站，双指或滚轮缩放。'});
document.querySelector('#disassemble').onclick=()=>{disassembled=!disassembled;parts.forEach((p,i)=>{let d=p.p.clone();if(disassembled)d.add(new THREE.Vector3(Math.sign(d.x||1)*((i%5)+3),Math.sign(d.y||1)*((i%4)+2),Math.sign(d.z||1)*((i%7)+3)));p.o.position.copy(d)});document.querySelector('#integrity').textContent=disassembled?'分解中':'100%';document.querySelector('#integritybar').style.width=disassembled?'35%':'100%';toast(disassembled?'模块拆解完成':'结构已复位')};
document.querySelector('#reset').onclick=()=>{disassembled=false;parts.forEach(p=>p.o.position.copy(p.p));document.querySelector('#integrity').textContent='100%';document.querySelector('#integritybar').style.width='100%';toast('空间站结构已复位')};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ 继续':'Ⅱ 暂停';toast(paused?'运动已暂停':'运动已恢复')};
document.querySelector('#zoomIn').onclick=()=>{radius=Math.max(75,radius*.82);cameraUpdate()};document.querySelector('#zoomOut').onclick=()=>{radius=Math.min(500,radius*1.2);cameraUpdate()};document.querySelector('#home').onclick=()=>{theta=.25;phi=1.22;radius=175;target.set(0,0,0);cameraUpdate()};
document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.querySelector('#quality').onchange=e=>{let q=Number(e.target.value);renderer.setPixelRatio(Math.min(devicePixelRatio,q));renderer.setSize(innerWidth,innerHeight);toast('画质设置已更新')};
let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;theta-=(e.clientX-px)*.006;phi=Math.max(.25,Math.min(2.85,phi+(e.clientY-py)*.006));px=e.clientX;py=e.clientY;cameraUpdate()});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(65,Math.min(550,radius+e.deltaY*.12));cameraUpdate()},{passive:true});
let last=0;function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-last)/1000,.04);last=t;if(!paused){station.rotation.y+=dt*.025;shipT+=dt;ship.position.x=-75+Math.sin(shipT*.12)*22;ship.position.z=70+Math.cos(shipT*.12)*22;ship.rotation.y=Math.sin(shipT*.12)*.25;planets.rotation.y+=dt*.008}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
